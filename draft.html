<html lang="en">
<head>

<style>
    body {
        background: rgb (75, 240, 252);

        padding: 30px;
        background: linear-gradient(90deg, #ff0000, #6600ff);

        margin: 0;

    }

        padding: 12px;
        margin: 20px auto;

    }

    .game-item {

        margin: 15px 0;
        padding: 20px;
        border-radius: 10px;

        display: flex;

        gap: 20px;
    }

    .game-item:hover {

        background: #262626;
        border-left: 5px solid #6600ff;
    }

    .game-item img {
        width: 120px;
        height: 160px;
        border-radius: 8px;
        object-fit: cover;
    }

    .game-item h2 {
        margin: 0;
        font-size: 24px;
    }

    .details {
        margin-top: 10px;
        padding: 10px;
        background: #111;
        border-radius: 8px;
        display: none;
        animation: fadeIn 0.3s ease-in-out;
    }

    .details a {
        color: #00aaff;
        text-decoration: none;
        font-weight: bold;
    }

    .details a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }
</style>
